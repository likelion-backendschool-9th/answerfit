spring.application.name=answerfit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 각자 컴퓨터의 backend/.env(git에 올리지 않음)에서 값을 읽는다. 없으면 건너뛴다.
# ./gradlew bootRun은 backend/에서, VSCode·IntelliJ 실행 버튼은 저장소 루트에서 실행해 두 위치를 모두 본다.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# 로그인 (docs/backend/user/README.md). 값은 backend/.env나 환경 변수로 넣는다.
# JWT_SECRET이 없으면 서버를 켤 때마다 임시 키를 만든다.
answerfit.jwt.secret=${JWT_SECRET:}
answerfit.kakao.client-id=${KAKAO_CLIENT_ID:}
answerfit.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
